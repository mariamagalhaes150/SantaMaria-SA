<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Santa Maria Assistência Funerária</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Link dos ícones  -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/conta/criarConta.css">
</head>
<body>

    <!-- Cabeçalho   -->
    <header class="header-cadastro">
        <div class="header-container">

            <div class="logo">
                <a href="../index.html">
                    <img src="../img/logo-santa-maria.png" alt="Logo Santa Maria Assistência Funerária">
                </a>
            </div>

            <!-- Botão Voltar ao site -->
            <a href="../pagInicial.html" class="btn-voltar">
                <span class="material-symbols-outlined">arrow_back</span>
                Voltar ao site
            </a>
        </div>
    </header>

    <!-- Cadastro (parte principal)-->
    <main class="main-cadastro">
        <section class="card-cadastro">
            <!--Cabeçalho-->
            <div class="card-cabecalho">
                <span class="tag">MINHA CONTA</span>
                <h1>Criar conta</h1>
                <p>Preencha seus dados para criar sua conta Santa Maria.</p>
            </div>

            <form action="#" method="POST" class="form-cadastro">
                
                <!-- Campo Nome -->
                <div class="campo-grupo">
                    <label for="nome">Nome</label>
                    <div class="input-wrapper">
                        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                    </div>
                </div>

                <!-- Campo E-mail -->
                <div class="campo-grupo">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper com-icone">
                        <input type="email" id="email" name="email" placeholder="Seu e-mail" required>
                        <span class="material-symbols-outlined icone-input">mail</span>
                    </div>
                </div>

                <!-- Linha dupla: Data de nascimento e CPF -->
                <div class="linha-dupla">
                    <div class="campo-grupo">
                        <label for="nascimento">Data de nascimento</label>
                        <div class="input-wrapper">
                            <input type="text" id="nascimento" name="nascimento" placeholder="DD/MM/AAAA" maxlength="10" required>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="cpf">CPF</label>
                        <div class="input-wrapper">
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                        </div>
                    </div>
                </div>

                <!-- Campo Senha -->
                <div class="campo-grupo">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper com-icone">
                        <input type="password" id="senha" name="senha" placeholder="Crie sua senha" required>
                        <button type="button" class="btn-toggle-senha" aria-label="Mostrar senha">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Campo Confirmar Senha -->
                <div class="campo-grupo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <div class="input-wrapper com-icone">
                        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite sua senha novamente" required>
                        <button type="button" class="btn-toggle-senha" aria-label="Mostrar senha">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="botoes-acao">
                    <button type="button" class="btn-cancelar" onclick="window.history.back()">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar</button>
                </div>

                <!-- Aviso de Segurança -->
                <div class="aviso-seguranca">
                    <span class="material-symbols-outlined">lock</span>
                    <span>Seus dados estão protegidos.</span>
                </div>

            </form>
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="footer-cadastro">
        <div class="footer-container">
            <span>Santa Maria • Assistência funerária</span>
            <span>Cuidar é estar presente.</span>
        </div>

        <script src="../../js/criarConta.js"></script>"></script>
    </footer>

</body>
</html>
